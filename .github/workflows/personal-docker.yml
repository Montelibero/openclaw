name: Personal Docker (itolstov)

# Builds the personal `deploy` stack as a single linux/amd64
# image and publishes to ghcr.io/<owner>/openclaw:latest. Lives in the fork
# only; upstream's docker-release workflow stays untouched.

on:
  push:
    branches: [deploy]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".agents/**"
      - "skills/**"
      - "MY_PATCHES.md"
  workflow_dispatch:

concurrency:
  group: personal-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image name
        id: image
        run: |
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${IMAGE_LC}" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, :latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          # Layer + mount-cache хранятся в отдельном :buildcache-теге GHCR,
          # а не в GHA-кэше: так buildkit-mount-cache (pnpm-store) переживает
          # эфемерные runner'ы и pnpm install не качает деревья заново.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            OPENCLAW_DOCKER_APT_PACKAGES=openssh-client build-essential cmake
